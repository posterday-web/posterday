<!-- Source for img/og-image.png, the picture shown when someone shares a Posterday link. Open it in a browser at 1200x630 and screenshot it to update. -->
<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#f4f3f0;font-family:"Inter Tight",Helvetica,Arial,sans-serif;color:#2d2c2c;position:relative;overflow:hidden}
.top{position:absolute;left:80px;top:72px;display:flex;align-items:center;gap:20px;font-size:34px;font-weight:500;letter-spacing:-.01em}
.top img{height:64px;width:auto}
h1{position:absolute;left:80px;top:180px;margin:0;font-weight:300;font-size:92px;line-height:1.02;letter-spacing:-.03em;width:760px}
p{position:absolute;left:80px;top:420px;margin:0;font-size:28px;color:#58595b;width:640px;line-height:1.3}
.url{position:absolute;left:80px;bottom:56px;font-size:24px;color:#3c5956;font-weight:500}
.posters{position:absolute;right:70px;top:70px;width:330px;height:490px}
.pp{position:absolute;width:190px;height:260px;background:#fbfaf8;border:1px solid rgba(45,44,44,.16);border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:14px;box-sizing:border-box}
.pp i{display:block;height:130px;border-radius:2px}
.pp b{display:block;height:12px;background:#2d2c2c;width:80%;margin-top:16px}
.pp s{display:block;height:10px;background:#b9b6b0;width:55%;margin-top:10px}
</style></head><body>
<div class="top"><img src="../img/logo.svg" alt="Posterday"></div>
<h1>UK art and design degree shows</h1>
<p>Every degree show and graduate showcase, all in one place, all year round.</p>
<div class="url">posterday.com</div>
<div class="posters">
 <div class="pp" style="left:0;top:40px;transform:rotate(-6deg)"><i style="background:#2f7bd8"></i><b></b><s></s></div>
 <div class="pp" style="left:130px;top:0;transform:rotate(5deg)"><i style="background:#ec6a3a"></i><b></b><s></s></div>
 <div class="pp" style="left:70px;top:220px;transform:rotate(-1deg)"><i style="background:#1fae7a"></i><b></b><s></s></div>
</div>
</body></html>
