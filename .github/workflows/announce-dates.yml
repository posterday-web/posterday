# Every morning, emails subscribers (through Kit) about any shows that have new dates in shows.js.
# Needs the repository secret KIT_API_KEY. See tools/announce-dates.js.
name: Email new dates
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: announce-dates
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/announce-dates.js
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      - name: Save which dates have been sent
        run: |
          if git diff --quiet -- announced.json && [ -z "$(git status --porcelain announced.json)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announced.json
          git commit -m "Record new dates emailed to subscribers"
          git pull --rebase
          git push
